eline`,`cli-operational-safety`],application:[]},{id:`brain-initialization`,domain:`安装部署`,one_liner:`gbrain init 用 --pglite 起本地 WASM 数据库，embedding 的 provider / 维度须在 init 时一次传对，因为 init 会重写 config.json 且把 DB 向量列维度锁死`,stage:`stage-1 stage-2`,sources:[`experiments/gbrain/stage-1-bootstrap/handbook.md#四、初始化 PGLite brain`,`experiments/gbrain/stage-1-bootstrap/handbook.md#2、选择 embedding provider 的写法陷阱`,`experiments/gbrain/stage-2-experiment/case-5-enrichment-pipeline/handbook.md#1、gbrain init 的隐藏陷阱：会覆盖 config.json`],prerequisite:[`gbrain-install-upgrade`],related:[`pglite-storage-engine`,`dashscope-endpoint-patch`,`embedding-generation`],application:[`import-and-sync`]},{id:`brainbench-eval`,domain:`检索`,one_liner:`BrainBench 是 GBrain 自带的 self-produced ablation（240 page 语料 + 145 关系型 query），P@5 49.1% / R@5 97.9% vs grep-only baseline，但它自出题自评分、不能直接横评 mem0/Zep，跨系统横评应用第三方数据集`,stage:`stage-2`,sources:[`experiments/gbrain/stage-2-experiment/case-4-hybrid-retrieval-pipeline/handbook.md#八、BrainBench 评估：批判性使用 self-produced ablation`,`experiments/gbrain/stage-2-experiment/case-4-hybrid-retrieval-pipeline/handbook.md#4、批判性使用 BrainBench 数字`],prerequisite:[`hybrid-retrieval-pipeline`],related:[`search-modes-and-cost`],application:[]},{id:`brains-and-sources`,domain:`组织与集成`,one_liner:`GBrain 组织模型由两条正交轴构成——brain 轴（独立数据库边界，用 GBRAIN_HOME 切换）× source 轴（同库内容仓，用 GBRAIN_SOURCE 切换，同 slug 可多源共存）；跨 brain 联合检索是「YOUR JOB」、DB 不自动做`,stage:`stage-2`,sources:[`experiments/gbrain/stage-2-experiment/case-8-brains-and-sources/handbook.md#一、建立两个独立 Brain`,`experiments/gbrain/stage-2-experiment/case-8-brains-and-sources/handbook.md#二、挂载注册与 Brain 轴路由`,`experiments/gbrain/stage-2-experiment/case-8-brains-and-sources/handbook.md#三、Cross-Brain Federation`,`experiments/gbrain/stage-2-experiment/case-8-brains-and-sources/handbook.md#四、Source 轴：同库内容仓`,`experiments/gbrain/stage-2-experiment/case-8-brains-and-sources/handbook.md#3.1 关于 6 层优先级路由`],prerequisite:[`brain-initialization`,`import-and-sync`],related:[`mcp-server`],application:[]},{id:`cli-operational-safety`,domain:`陷阱与运维`,one_liner:`GBrain CLI 在 PGLite 上写完结果常不主动退出、且 pipe 会因 EPIPE 卡死，所有命令须用 timeout 包裹（exit 124 当正常）并改「重定向到文件再 cat」两段式`,stage:`stage-1 stage-2`,sources:[`experiments/gbrain/stage-1-bootstrap/handbook.md#2、Demo 1`,`experiments/gbrain/stage-1-bootstrap/handbook.md#3、需要持续注意的工程化经验`,`experiments/gbrain/stage-2-experiment/case-1-knowledge-model/handbook.md#3、gbrain import：把 8 page 一次性入库`],prerequisite:[],related:[`pglite-storage-engine`],application:[`brain-first-lookup`]},{id:`dashscope-endpoint-patch`,domain:`安装部署`,one_liner:`GBrain 的 DashScope recipe 默认走阿里云国际站端点、国内 KEY 被判无效，且 config 层 override 不生效，须 sed 直改本机源码默认值指向国内站`,stage:`stage-1 stage-2`,sources:[`experiments/gbrain/stage-1-bootstrap/handbook.md#3、隔离验证`,`experiments/gbrain/stage-1-bootstrap/handbook.md#4、三轮失败 workaround`,`experiments/gbrain/stage-1-bootstrap/handbook.md#5、最终生效的 workaround`,`experiments/gbrain/stage-2-experiment/case-4-hybrid-retrieval-pipeline/handbook.md#三、启用向量索引：DashScope embedding`],prerequisite:[`gbrain-install-upgrade`],related:[`providers-and-credentials`,`embedding-generation`],application:[`embedding-generation`]},{id:`doctor-health-check`,domain:`陷阱与运维`,one_liner:`gbrain doctor 是 47 项健康检查，完整版会向 embedding provider 真发探针；embedding_provider 与 brain_score 是两类关键项，前者反映链路通不通、后者反映数据丰满度`,stage:`stage-1`,sources:["experiments/gbrain/stage-1-bootstrap/handbook.md#2、首次 `gbrain doctor`",`experiments/gbrain/stage-1-bootstrap/handbook.md#四、初始化 PGLite brain`],prerequisite:[`brain-initialization`],related:[`providers-and-credentials`],application:[]},{id:`dream-cycle`,domain:`自维护`,one_liner:`gbrain dream 是「脑库自己整理自己」的离线内整循环，一次 blocking single-run 跑完 16 个 phase（早期文档简化为 9），幂等可 cron 调度；synthesize/patterns/propose_takes 三个 phase 依赖 Anthropic`,stage:`stage-2`,sources:[`experiments/gbrain/stage-2-experiment/case-6-dream-cycle/handbook.md#一、Dream Cycle 的定位——Brain`,`experiments/gbrain/stage-2-experiment/case-6-dream-cycle/handbook.md#3、9 Phase vs 16 Phase in/stage-1-bootstrap/handbook.md#1.1 Bun 是什么`,"experiments/gbrain/stage-1-bootstrap/handbook.md#2、第一次 `bun install -g`",`experiments/gbrain/stage-1-bootstrap/handbook.md#3、强制刷新 Bun 缓存 + 显式分支安装`],prerequisite:[],related:[`dashscope-endpoint-patch`,`brain-initialization`],application:[`brain-initialization`]},{id:`gbrain-overview`,domain:`概览`,one_liner:`GBrain 是给 AI Agent 提供本地持久化记忆的 Brain 框架，把知识建模为 markdown page、以 markdown 为真相源、git 为审计轨迹、PGLite 为零 server 存储`,stage:`stage-1 stage-2`,sources:[`experiments/gbrain/stage-1-bootstrap/handbook.md#一、GBrain 项目认识与实验目标`,`experiments/gbrain/stage-1-bootstrap/handbook.md#1、GBrain 是什么`,`experiments/gbrain/stage-2-experiment/case-2-brain-first-loop/handbook.md#1、brain-first lookup 的设计哲学`],prerequisite:[],related:[`page-knowledge-model`,`pglite-storage-engine`],application:[`brain-first-lookup`,`hybrid-retrieval-pipeline`]},{id:`graph-query-and-backlinks`,domain:`知识图谱`,one_liner:`gbrain graph-query 按 slug 正向多跳遍历 typed-link（--depth/--type/--direction），gbrain backlinks 返回反向链接的结构化 JSON；同一条边正反双向可查，是图谱相对纯向量检索的结构性优势`,stage:`stage-2`,sources:[`experiments/gbrain/stage-2-experiment/case-3-self-wiring-graph/handbook.md#四、cascade 优先级与 per-edge context：用 graph-query 实测`,`experiments/gbrain/stage-2-experiment/case-3-self-wiring-graph/handbook.md#五、backlinks：从反面看 link`],prerequisite:[`self-wiring-graph-cascade`],related:[`hybrid-retrieval-pipeline`],application:[`hybrid-retrieval-pipeline`]},{id:`hybrid-retrieval-pipeline`,domain:`检索`,one_liner:`gbrain query 走 7 阶段管线（intent → expansion → hybrid(HNSW+BM25) → RRF fusion → graph_augment → reranker → token_budget），把向量、关键词、图谱各放到合适位置；RRF 分数可超 1.0、不是相似度`,stage:`stage-1 stage-2`,sources:[`experiments/gbrain/stage-2-experiment/case-4-hybrid-retrieval-pipeline/handbook.md#一、为什么 hybrid 比单一检索更稳`,`experiments/gbrain/stage-2-experiment/case-4-hybrid-retrieval-pipeline/handbook.md#五、Hybrid vs BM25：keyword 与 semantic 的互补`,`experiments/gbrain/stage-2-experiment/case-4-hybrid-retrieval-pipeline/handbook.md#六、Graph augment：典型关系型 query 的关键`,`experiments/gbrain/stage-2-experiment/case-4-hybrid-retrieval-pipeline/handbook.md#4、RRF 分数为何超过 1.0`],prerequisite:[`embedding-generation`,`brain-first-lookup`],related:[`graph-query-and-backlinks`,`search-modes-and-cost`],application:[`brainbench-eval`]},{id:`import-and-sync`,domain:`数据模型`,one_liner:`gbrain import 把目录 markdown 批量入库，gbrain sync 基于 git commit hash 范围做增量——改了 markdown 不 commit，sync 就当作没发生；frontmatter 写死 slug 会导致静默跳过`,stage:`stage-2`,sources:[`experiments/gbrain/stage-2-experiment/case-1-knowledge-model/handbook.md#3、gbrain import：把 8 page 一次性入库`,`experiments/gbrain/stage-2-experiment/case-1-knowledge-model/handbook.md#七、回流 DB：gbrain sync 的 git-commit 约定`,`experiments/gbrain/stage-2-experiment/case-1-knowledge-model/handbook.md#4、第一个常见陷阱：frontmatter 的 slug 字段`],prerequisite:[`brain-initialization`,`page-knowledge-model`],related:[`cli-operational-safety`],application:[`embedding-generation`,`self-wiring-graph-cascade`]},{id:`mcp-server`,domain:`组织与集成`,one_liner:`gbrain serve 把 brain 通过 MCP 协议暴露给 Claude Code / Cursor / Windsurf 等客户端，stdio 本地接入最简单、HTTP 带 Admin Dashboard；73 个工具在 CLI/stdio/HTTP 三种入口结果一致（thin wrappers identical ops），换 brain = 换 GBRAIN_HOME`,stage:`stage-2`,sources:[`experiments/gbrain/stage-2-experiment/case-10-mcp-server/handbook.md#二、stdio 模式接入 Claude Code`,`experiments/gbrain/stage-2-experiment/case-10-mcp-server/handbook.md#2、MCP 工具清单验证`,`experiments/gbrain/stage-2-experiment/case-10-mcp-server/handbook.md#2.1 73 个工具的分类结构`,`experiments/gbrain/stage-2-experiment/case-10-mcp-server/handbook.md#thin wrappers identical ops`,`experiments/gbrain/stage-2-experiment/case-10-mcp-server/handbook.md#三、HTTP 模式与 Admin Dashboard（进阶可选）`],prerequisite:[],related:[`brains-and-sources`,`skill-development`],application:[]},{id:`minions-job-queue`,domain:`任务队列`,one_liner:`Minions 是 Postgres-native 持久化任务队列（灵感来自 BullMQ），supervisor 监控 worker crash 并自动重启，用 9 status 状态机 + lock_token 排他锁 + 指数退避保证 durability；job resume 是从头重跑、非 checkpoint stage:`stage-1 stage-2`,sources:[`experiments/gbrain/stage-2-experiment/case-7-minions-queue/handbook.md#一、Postgres 后端准备`,`experiments/gbrain/stage-2-experiment/case-7-minions-queue/handbook.md#2、Postgres-native vs Redis 的工程权衡`,`experiments/gbrain/stage-2-experiment/case-4-hybrid-retrieval-pipeline/handbook.md#三、启用向量索引：DashScope embedding`],prerequisite:[`pglite-storage-engine`],related:[`brain-initialization`],application:[`minions-job-queue`]},{id:`providers-and-credentials`,domain:`安装部署`,one_liner:`GBrain 的 embedding 与 chat 是两类独立能力，需按能力配双 KEY（DashScope 担纲 embedding、DeepSeek/Anthropic 担纲 chat），且 providers list 的 ready 是静态检测、不代表 KEY 真有效`,stage:`stage-1 stage-2`,sources:["experiments/gbrain/stage-1-bootstrap/handbook.md#1、`gbrain providers list` 查看 14 个 provider 就绪状态",`experiments/gbrain/stage-1-bootstrap/handbook.md#2.1 为何需要双 KEY 配置`,`experiments/gbrain/stage-2-experiment/case-5-enrichment-pipeline/handbook.md#1、dream 需要的两个 API key`],prerequisite:[],related:[`dashscope-endpoint-patch`,`doctor-health-check`],application:[`embedding-generation`,`dream-cycle`]},{id:`schema-and-source-verification`,domain:`陷阱与运维`,one_liner:`GBrain 迭代快、外部文档常滞后，核验真相要分三层——运行时看 gbrain stats、结构看源码 schema、操作看 docs/guides，不被过期文档误导（如 dream 早期文档说 9 phase、实际 16）`,stage:`stage-2`,sources:[`experiments/gbrain/stage-2-experiment/case-1-knowledge-model/handbook.md#四、批判性使用开源项目：用源码核验真实表名`,`experiments/gbrain/stage-2-experiment/case-1-knowledge-model/handbook.md#2、从 schema.sql 与 migrate.ts 核验表结构`,`experiments/gbrain/stage-2-experiment/case-5-enrichment-pipeline/handbook.md#4、16 phase 详解（与 KB 描述的 9 phase 对比）`],prerequisite:[],related:[`dream-cycle`],application:[]},{id:`search-modes-and-cost`,domain:`检索`,one_liner:`3 种 search mode（conservative/balanced/tokenmax）是 searchLimit/tokenBudget/expansion/reranker 四开关的 preset，用 config set 切换；小 brain + reranker 未配时三者输出相同，真正的 cost 旋钮在下游 LLM 选择`,stage:`stage-2`,sources:[`experiments/gbrain/stage-2-experiment/case-4-hybrid-retrieval-pipeline/handbook.md#七、3 种 mode 与
